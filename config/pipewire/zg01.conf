# Yamaha ZG01: virtual devices for voice chat apps (Zoom, Slack, ...).
#
#   "ZG01 Mic"  : capture ch2/3 (= ZG01 "Voice" = microphone)
#   "ZG01 Chat" : playback ch8/9 (= ZG01 "Voice" = voice chat bus,
#                 controlled by the voice chat level knob on the ZG01)
#
# Node names below assume the default PipeWire profiles
# ("analog-surround-40" for capture, "multichannel-output" for playback).
# Check them with: wpctl status / pactl list short sources
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "ZG01 Mic"
      capture.props = {
        node.name      = "zg01_mic_capture"
        target.object  = "alsa_input.usb-Yamaha_Corporation_Yamaha_ZG01-00.analog-surround-40"
        audio.position = [ RL RR ]
        stream.dont-remix = true
        node.passive   = true
      }
      playback.props = {
        node.name      = "zg01_mic"
        media.class    = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "ZG01 Chat"
      capture.props = {
        node.name      = "zg01_chat"
        media.class    = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "zg01_chat_playback"
        target.object  = "alsa_output.usb-Yamaha_Corporation_Yamaha_ZG01-00.multichannel-output"
        audio.position = [ AUX8 AUX9 ]
        stream.dont-remix = true
        node.passive   = true
      }
    }
  }
]
