# Yamaha ZG01 (0499:1513)
# Let snd-usb-audio handle the ZG01 using the existing quirk entry of the
# Steinberg UR22 (0499:1509), which has the same interface layout:
#   if1/if2 = UAC2-style audio streaming, if3 = Yamaha MIDI, if4 = ignored
# The UR22 entry also carries QUIRK_FLAG_GENERIC_IMPLICIT_FB.
options snd_usb_audio quirk_alias=04991513:04991509
