# Yamaha ZG01: force the capture format to S32LE.
# The capture interface advertises bmFormats = 0xffffffff, so the kernel
# exposes bogus formats (U8, FLOAT_LE, ...) and PipeWire would pick
# FLOAT_LE. The real data is 32-bit signed integer.
# Requires WirePlumber 0.5 or later.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Yamaha_Corporation_Yamaha_ZG01.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
      }
    }
  }
]
